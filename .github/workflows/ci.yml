# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# CI never deploys: the Worker is deployed manually with `npm run deploy`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      node-version: "22"
      # Bundles the Worker without uploading anything (no Cloudflare credentials in CI).
      build-command: WRANGLER_SEND_METRICS=false npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
