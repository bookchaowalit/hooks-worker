name = "solo-empire-hooks"
main = "src/worker.ts"
compatibility_date = "2026-10-04"
account_id = "4a3ba0eee7dba5c9131a0d1ad3639114"
workers_dev = true

# Bind the custom domain only after the owner approves the DNS change
# (infra/platform/domains.yaml entry hooks.bookchaowalit.com, status reserved).
# routes = [
#   { pattern = "hooks.bookchaowalit.com", custom_domain = true }
# ]

# Raw signed events land here first (bronze layer).
# The bucket must exist before deploy: wrangler r2 bucket create solo-empire-hooks
[[r2_buckets]]
binding = "HOOKS_BUCKET"
bucket_name = "solo-empire-hooks"

# Worker secrets are never stored in this file; set them with `wrangler secret put`:
#   STRIPE_WEBHOOK_SECRET  required, Stripe endpoint signing secret
#   FORWARD_URL            optional, receiver for minimal event summaries
#   FORWARD_TOKEN          optional, bearer credential for FORWARD_URL
